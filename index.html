<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Smartphone Local</title>
    <style>
        :root {
            --phone-bg: #d63031;       
            --screen-bg: #f5f6fa;      
            --keypad-btn: #ffffff;     
            --keypad-text: #2f3640;    
            --call-btn: #4cd137;       
            --call-btn-hover: #44bd32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #2f3542;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .smartphone {
            width: 320px;
            height: 640px;
            background-color: var(--phone-bg);
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            border: 4px solid #b21f1f;
        }

        .smartphone::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 5px;
            background-color: #7f1d1d;
            border-radius: 10px;
            z-index: 10;
        }

        .screen {
            width: 100%;
            height: 100%;
            background-color: var(--screen-bg);
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            height: 30px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #000;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .display-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
        }

        .phone-number {
            font-size: 2rem;
            color: #2f3640;
            min-height: 45px;
            text-align: center;
            word-break: break-all;
            width: 100%;
        }

        .backspace {
            font-size: 1.2rem;
            color: #718093;
            cursor: pointer;
            margin-top: 5px;
            user-select: none;
            visibility: hidden;
        }

        .backspace.visible {
            visibility: visible;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px 30px 40px 30px;
            background-color: #fff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        .key {
            background-color: #f1f2f6;
            color: var(--keypad-text);
            border: none;
            height: 65px;
            width: 65px;
            border-radius: 50%;
            font-size: 1.6rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            transition: background-color 0.1s, transform 0.05s;
        }

        .key:active {
            background-color: #dcdde1;
            transform: scale(0.95);
        }

        .key span {
            font-size: 0.6rem;
            color: #7f8c8d;
            text-transform: uppercase;
            margin-top: -2px;
        }

        .key.call-btn {
            background-color: var(--call-btn);
            color: white;
            grid-column: 2;
        }

        .key.call-btn:hover {
            background-color: var(--call-btn-hover);
        }

        .calling-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e24;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px 20px;
            transform: translateY(100%);
            transition: transform 0.4s ease-in-out;
            z-index: 20;
        }

        .calling-screen.active {
            transform: translateY(0);
        }

        .contact-info {
            text-align: center;
        }

        .contact-info h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .call-status {
            color: #ff7675; 
            animation: blink 1.5s infinite;
        }

        .end-call-btn {
            background-color: #ff2d55;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(255,45,85,0.4);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="smartphone">
        <div class="screen">
            <div class="status-bar">
                <span id="clock">12:00</span>
                <span>📶 100% 🔋</span>
            </div>

            <div class="display-container">
                <div class="phone-number" id="phone-display"></div>
                <div class="backspace" id="backspace-btn">⌫</div>
            </div>

            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2<span>abc</span></button>
                <button class="key" onclick="pressKey('3')">3<span>def</span></button>
                
                <button class="key" onclick="pressKey('4')">4<span>ghi</span></button>
                <button class="key" onclick="pressKey('5')">5<span>jkl</span></button>
                <button class="key" onclick="pressKey('6')">6<span>mno</span></button>
                
                <button class="key" onclick="pressKey('7')">7<span>pqrs</span></button>
                <button class="key" onclick="pressKey('8')">8<span>tuv</span></button>
                <button class="key" onclick="pressKey('9')">9<span>wxyz</span></button>
                
                <button class="key" onclick="pressKey('*')">*</button>
                <button class="key" onclick="pressKey('0')">0<span>+</span></button>
                <button class="key" onclick="pressKey('#')">#</button>
                
                <button class="key call-btn" id="start-call">📞</button>
            </div>

            <div class="calling-screen" id="calling-screen">
                <div class="contact-info">
                    <h2 id="calling-number">0000-0000</h2>
                    <p class="call-status">Chama...</p>
                </div>
                <button class="end-call-btn" id="end-call">❌</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('phone-display');
        const backspaceBtn = document.getElementById('backspace-btn');
        const callingScreen = document.getElementById('calling-screen');
        const callingNumber = document.getElementById('calling-number');
        const startCallBtn = document.getElementById('start-call');
        const endCallBtn = document.getElementById('end-call');
        const clockDisplay = document.getElementById('clock');

        const dtmfFrequencies = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
        };

        let audioCtx = null;
        let ringInterval = null;
        let ringOsc1 = null, ringOsc2 = null, ringGain = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(key) {
            initAudio();
            if (!dtmfFrequencies[key]) return;

            const frequencies = dtmfFrequencies[key];
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc1.type = 'sine';
            osc1.frequency.value = frequencies[0];
            osc2.type = 'sine';
            osc2.frequency.value = frequencies[1];

            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.12);
            osc2.stop(audioCtx.currentTime + 0.12);
        }

        function playClickSound(frequency = 400, duration = 0.08) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = frequency;

            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startRingTone() {
            initAudio();
            
            const playPulse = () => {
                ringOsc1 = audioCtx.createOscillator();
                ringOsc2 = audioCtx.createOscillator();
                ringGain = audioCtx.createGain();

                ringOsc1.type = 'sine';
                ringOsc1.frequency.value = 400;
                ringOsc2.type = 'sine';
                ringOsc2.frequency.value = 450;

                ringGain.gain.setValueAtTime(0, audioCtx.currentTime);
                ringGain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.1);
                ringGain.gain.setValueAtTime(0.06, audioCtx.currentTime + 1.0);
                ringGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.1);

                ringOsc1.connect(ringGain);
                ringOsc2.connect(ringGain);
                ringGain.connect(audioCtx.destination);

                ringOsc1.start();
                ringOsc2.start();
                
                ringOsc1.stop(audioCtx.currentTime + 1.2);
                ringOsc2.stop(audioCtx.currentTime + 1.2);
            };

            playPulse();
            ringInterval = setInterval(playPulse, 4000); // Fica tocando em loop
        }

        function stopRingTone() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
            if (ringGain) {
                try {
                    ringGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    ringGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                } catch(e) {}
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clockDisplay.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function pressKey(value) {
            playTone(value);
            if (display.textContent.length < 15) {
                display.textContent += value;
                checkBackspace();
            }
        }

        backspaceBtn.addEventListener('click', () => {
            playClickSound(300, 0.05);
            display.textContent = display.textContent.slice(0, -1);
            checkBackspace();
        });

        function checkBackspace() {
            if (display.textContent.length > 0) {
                backspaceBtn.classList.add('visible');
            } else {
                backspaceBtn.classList.remove('visible');
            }
        }

        // Abre a tela de ligação interna e solta o som (sem sair da tela)
        startCallBtn.addEventListener('click', () => {
            const number = display.textContent;
            if (number.trim() !== "") {
                callingNumber.textContent = number;
                callingScreen.classList.add('active');
                startRingTone();
            } else {
                alert("Por favor, digite um número primeiro!");
            }
        });

        // Desliga e corta o loop do áudio
        endCallBtn.addEventListener('click', () => {
            stopRingTone();
            playClickSound(200, 0.15);
            callingScreen.classList.remove('active');
        });
    </script>
</body>
</html>
